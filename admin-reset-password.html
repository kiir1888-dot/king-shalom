<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Admin Password | King's Shalom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --navy: #082a4a; --blue: #0d4775; --gold: #e9b949; --teal: #168c87; --ink: #172536; --muted: #65758b; }
      * { box-sizing: border-box; }
      body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1.25rem; background-color: var(--navy); background-image: linear-gradient(135deg, rgba(22, 140, 135, 0.28), transparent 42%), repeating-linear-gradient(120deg, transparent 0 48px, rgba(255, 255, 255, 0.035) 48px 49px); font-family: 'Poppins', sans-serif; color: var(--ink); }
      .auth-panel { position: relative; overflow: hidden; width: min(100%, 440px); padding: 2.75rem; background: #fff; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 8px; box-shadow: 0 24px 70px rgba(0, 12, 30, 0.36); }
      .auth-panel::before { content: ''; position: absolute; inset: 0 0 auto; height: 5px; background: linear-gradient(90deg, var(--gold) 0 52%, var(--teal) 52% 100%); }
      .brand-mark { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 1.25rem; border-radius: 8px; background: var(--navy); color: var(--gold); font-weight: 700; }
      h1 { margin: 0 0 0.5rem; color: var(--navy); font-size: 1.65rem; }
      p { margin: 0 0 1.5rem; color: var(--muted); font-size: 0.92rem; line-height: 1.6; }
      .field { margin-bottom: 1rem; }
      label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
      input { width: 100%; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
      input:focus { outline: 3px solid rgba(22, 140, 135, 0.14); border-color: var(--teal); }
      button { width: 100%; padding: 0.8rem; border: 0; border-radius: 6px; background: var(--navy); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: var(--blue); }
      button:disabled { opacity: 0.65; cursor: wait; }
      .status { display: none; margin-top: 1rem; font-size: 0.9rem; }
      .status.success { color: #166534; }
      .status.error { color: #b91c1c; }
      a { display: block; margin-top: 1.25rem; text-align: center; color: var(--navy); font-size: 0.9rem; font-weight: 600; }
      a:hover { color: var(--teal); }
      @media (max-width: 480px) { .auth-panel { padding: 2.25rem 1.5rem; } }
    </style>
  </head>
  <body>
    <main class="auth-panel">
      <div class="brand-mark" aria-hidden="true">KS</div>
      <h1>Create a new password</h1>
      <p>Use at least 12 characters. This link can only update an authorized King's Shalom administrator.</p>
      <form id="resetForm">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" type="password" minlength="12" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required />
        </div>
        <button id="submitButton" type="submit">Update password</button>
        <div class="status" id="status" role="status"></div>
      </form>
      <a href="admin-login.html">Back to admin login</a>
    </main>
    <script>
      const params = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = params.get('access_token') || '';
      const refreshToken = params.get('refresh_token') || '';
      const form = document.getElementById('resetForm');
      const submitButton = document.getElementById('submitButton');
      const status = document.getElementById('status');

      history.replaceState(null, '', window.location.pathname);

      if (!accessToken || !refreshToken || params.get('type') !== 'recovery') {
        submitButton.disabled = true;
        status.className = 'status error';
        status.textContent = 'This password reset link is invalid or has expired. Request a new link.';
        status.style.display = 'block';
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
          status.className = 'status error';
          status.textContent = 'The passwords do not match.';
          status.style.display = 'block';
          return;
        }

        submitButton.disabled = true;
        status.style.display = 'none';

        try {
          const response = await fetch('/api/admin/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ accessToken, refreshToken, password }),
          });
          const data = await response.json();
          status.className = `status ${response.ok ? 'success' : 'error'}`;
          status.textContent = data.message || 'Unable to update the password.';
          status.style.display = 'block';

          if (response.ok) {
            form.reset();
            window.setTimeout(() => { window.location.href = '/admin-login.html'; }, 1800);
          } else {
            submitButton.disabled = false;
          }
        } catch {
          status.className = 'status error';
          status.textContent = 'Unable to reach the server. Please try again.';
          status.style.display = 'block';
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
