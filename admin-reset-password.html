<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Admin Password | King's Shalom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1rem; background: #0A2E5D; font-family: 'Poppins', sans-serif; color: #1f2937; }
      .auth-panel { width: min(100%, 420px); padding: 2.5rem; background: #fff; border-radius: 8px; box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25); }
      h1 { margin: 0 0 0.5rem; color: #0A2E5D; font-size: 1.65rem; }
      p { margin: 0 0 1.5rem; color: #64748b; font-size: 0.92rem; line-height: 1.6; }
      .field { margin-bottom: 1rem; }
      label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
      input { width: 100%; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
      input:focus { outline: 3px solid rgba(10, 46, 93, 0.14); border-color: #0A2E5D; }
      button { width: 100%; padding: 0.8rem; border: 0; border-radius: 6px; background: #0A2E5D; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.65; cursor: wait; }
      .status { display: none; margin-top: 1rem; font-size: 0.9rem; }
      .status.success { color: #166534; }
      .status.error { color: #b91c1c; }
      a { display: block; margin-top: 1.25rem; text-align: center; color: #0A2E5D; font-size: 0.9rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main class="auth-panel">
      <h1>Create a new password</h1>
      <p>Use at least 12 characters. This link can only update an authorized King's Shalom administrator.</p>
      <form id="resetForm">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" type="password" minlength="12" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required />
        </div>
        <button id="submitButton" type="submit">Update password</button>
        <div class="status" id="status" role="status"></div>
      </form>
      <a href="admin-login.html">Back to admin login</a>
    </main>
    <script>
      const params = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = params.get('access_token') || '';
      const refreshToken = params.get('refresh_token') || '';
      const form = document.getElementById('resetForm');
      const submitButton = document.getElementById('submitButton');
      const status = document.getElementById('status');

      history.replaceState(null, '', window.location.pathname);

      if (!accessToken || !refreshToken || params.get('type') !== 'recovery') {
        submitButton.disabled = true;
        status.className = 'status error';
        status.textContent = 'This password reset link is invalid or has expired. Request a new link.';
        status.style.display = 'block';
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
          status.className = 'status error';
          status.textContent = 'The passwords do not match.';
          status.style.display = 'block';
          return;
        }

        submitButton.disabled = true;
        status.style.display = 'none';

        try {
          const response = await fetch('/api/admin/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ accessToken, refreshToken, password }),
          });
          const data = await response.json();
          status.className = `status ${response.ok ? 'success' : 'error'}`;
          status.textContent = data.message || 'Unable to update the password.';
          status.style.display = 'block';

          if (response.ok) {
            form.reset();
            window.setTimeout(() => { window.location.href = '/admin-login.html'; }, 1800);
          } else {
            submitButton.disabled = false;
          }
        } catch {
          status.className = 'status error';
          status.textContent = 'Unable to reach the server. Please try again.';
          status.style.display = 'block';
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
