<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | King's Shalom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0A2E5D 0%, #1a4d8f 100%);
      }
      .login-container {
        background: white;
        padding: 3rem;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
      }
      .login-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .login-header h1 {
        font-size: 1.8rem;
        color: #0A2E5D;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      .login-header p {
        color: #666;
        font-size: 0.9rem;
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-label {
        display: block;
        margin-bottom: 0.5rem;
        color: #333;
        font-weight: 600;
      }
      .form-control {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-family: 'Poppins', sans-serif;
      }
      .form-control:focus {
        outline: none;
        border-color: #0A2E5D;
        box-shadow: 0 0 0 3px rgba(10, 46, 93, 0.1);
      }
      .btn-login {
        width: 100%;
        padding: 0.75rem;
        background: #0A2E5D;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
      }
      .btn-login:hover {
        background: #082147;
      }
      .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }
      .password-wrapper input {
        width: 100%;
      }
      .toggle-password {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1.2rem;
        color: #666;
        padding: 0;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.3s;
      }
      .toggle-password:hover {
        color: #0A2E5D;
      }
      .error-message {
        color: #dc3545;
        font-size: 0.9rem;
        margin-top: 0.5rem;
        display: none;
      }
      .success-message {
        color: #28a745;
        font-size: 0.9rem;
        margin-top: 0.5rem;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <h1>Admin Login</h1>
        <p>King's Shalom News Management</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Enter email" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Enter password" required />
            <button type="button" class="toggle-password" id="togglePassword" title="Show/Hide password">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login">Login</button>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage">Logging in...</div>
      </form>
    </div>

    <script>
      // Toggle password visibility
      const passwordField = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('togglePassword');

      togglePasswordBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordField.setAttribute('type', type);
        togglePasswordBtn.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
      });

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;

        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'block';

        try {
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          const contentType = response.headers.get('content-type') || '';
          if (!contentType.includes('application/json')) {
            throw new Error('Server returned HTML instead of JSON. Ensure backend is running.');
          }

          const data = await response.json();

          if (data.success) {
            // Save token to localStorage
            localStorage.setItem('adminToken', data.token);

            // Support popup-based and full-page admin entry flows.
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage({ type: 'ADMIN_LOGIN_SUCCESS', token: data.token }, window.location.origin);
              window.close();
              return;
            }

            const adminPopup = document.getElementById('adminPopup');
            if (adminPopup) {
              adminPopup.style.display = 'block';
              successMsg.textContent = 'Login successful';
              return;
            }

            // Redirect to admin dashboard when no popup container exists.
            window.location.href = '/admin-dashboard.html';
          } else {
            successMsg.style.display = 'none';
            errorMsg.style.display = 'block';
            errorMsg.textContent = data.message || 'Login failed';
          }
        } catch (error) {
          successMsg.style.display = 'none';
          errorMsg.style.display = 'block';
          errorMsg.textContent = 'Connection error: ' + error.message;
        }
      });
    </script>
  </body>
</html>
