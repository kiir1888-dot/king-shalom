<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | King's Shalom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      :root {
        --auth-navy: #082a4a;
        --auth-blue: #0d4775;
        --auth-gold: #e9b949;
        --auth-teal: #168c87;
        --auth-ink: #172536;
        --auth-muted: #65758b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.25rem;
        background-color: var(--auth-navy);
        background-image:
          linear-gradient(135deg, rgba(22, 140, 135, 0.28), transparent 42%),
          repeating-linear-gradient(120deg, transparent 0 48px, rgba(255, 255, 255, 0.035) 48px 49px);
      }
      .login-container {
        position: relative;
        overflow: hidden;
        background: #fff;
        padding: 2.75rem;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 8px;
        box-shadow: 0 24px 70px rgba(0, 12, 30, 0.36);
        width: 100%;
        max-width: 430px;
      }
      .login-container::before {
        content: '';
        position: absolute;
        inset: 0 0 auto;
        height: 5px;
        background: linear-gradient(90deg, var(--auth-gold) 0 52%, var(--auth-teal) 52% 100%);
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        margin: 0 auto 1.1rem;
        border-radius: 8px;
        background: var(--auth-navy);
        color: var(--auth-gold);
        font-size: 1.1rem;
        font-weight: 700;
      }
      .login-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .login-header h1 {
        font-size: 1.8rem;
        color: var(--auth-navy);
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      .login-header p {
        color: var(--auth-muted);
        font-size: 0.9rem;
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--auth-ink);
        font-weight: 600;
      }
      .form-control {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #cbd5df;
        border-radius: 6px;
        font-family: 'Poppins', sans-serif;
      }
      .form-control:focus {
        outline: none;
        border-color: var(--auth-teal);
        box-shadow: 0 0 0 3px rgba(22, 140, 135, 0.14);
      }
      .btn-login {
        width: 100%;
        padding: 0.75rem;
        background: var(--auth-navy);
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
      }
      .btn-login:hover {
        background: var(--auth-blue);
        transform: translateY(-1px);
      }
      .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }
      .password-wrapper input {
        width: 100%;
      }
      .toggle-password {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1.2rem;
        color: #666;
        padding: 0;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.3s;
      }
      .toggle-password:hover {
        color: var(--auth-navy);
      }
      .error-message {
        color: #dc3545;
        font-size: 0.9rem;
        margin-top: 0.5rem;
        display: none;
      }
      .success-message {
        color: #28a745;
        font-size: 0.9rem;
        margin-top: 0.5rem;
        display: none;
      }

      .verification-panel {
        display: none;
        margin-top: 1rem;
        padding: 1rem;
        border: 1px solid #d9e2ec;
        border-radius: 12px;
        background: #f8fafc;
      }

      .verification-panel.is-visible {
        display: block;
      }
      .forgot-password-link {
        display: block;
        margin-top: 1rem;
        text-align: center;
        color: #0A2E5D;
        font-size: 0.9rem;
        font-weight: 600;
      }
      .forgot-password-link:hover {
        color: var(--auth-teal);
      }
      @media (max-height: 650px) {
        body {
          align-items: flex-start;
          padding: 0.75rem;
        }
        .login-container {
          padding: 1.5rem;
        }
        .brand-mark {
          width: 42px;
          height: 42px;
          margin-bottom: 0.5rem;
        }
        .login-header {
          margin-bottom: 0.75rem;
        }
        .login-header h1 {
          font-size: 1.5rem;
          margin-bottom: 0.25rem;
        }
        .login-header p {
          margin-bottom: 0;
        }
        .form-group {
          margin-bottom: 0.75rem;
        }
      }
      @media (max-width: 480px) {
        .login-container {
          padding: 2.25rem 1.5rem;
        }
      }
      @media (max-width: 480px) and (max-height: 650px) {
        .login-container {
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="brand-mark" aria-hidden="true">KS</div>
        <h1>Admin Login</h1>
        <p>King's Shalom News Management</p>
      </div>

      <form id="loginForm">
        <div class="form-group credential-field">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Enter email" autocomplete="email" required />
        </div>

        <div class="form-group credential-field">
          <label class="form-label" for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Enter password" required />
            <button type="button" class="toggle-password" id="togglePassword" title="Show/Hide password">
              👁️
            </button>
          </div>
        </div>

        <div class="verification-panel" id="verificationPanel">
          <strong>Check your email</strong>
          <p>Enter the six-digit verification code sent to your email address.</p>
          <div class="form-group">
            <label class="form-label" for="emailCode">Verification code</label>
            <input type="text" id="emailCode" class="form-control" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" />
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginButton">Login</button>
        <a class="forgot-password-link" href="admin-forgot-password.html">Forgot password?</a>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage">Logging in...</div>
      </form>
    </div>

    <script>
      // Toggle password visibility
      const passwordField = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('togglePassword');
      const loginButton = document.getElementById('loginButton');
      const verificationPanel = document.getElementById('verificationPanel');
      const emailCode = document.getElementById('emailCode');
      let emailCodePending = false;

      togglePasswordBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordField.setAttribute('type', type);
        togglePasswordBtn.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
      });

      fetch('/api/admin/session', { cache: 'no-store', credentials: 'same-origin' })
        .then((response) => {
          if (response.ok) {
            window.location.replace('/admin-dashboard.html');
          }
        })
        .catch(() => {});

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'block';
        loginButton.disabled = true;
        successMsg.textContent = emailCodePending ? 'Verifying code...' : 'Checking credentials...';

        try {
          const response = emailCodePending
            ? await fetch('/api/admin/email-code/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ code: emailCode.value }),
              })
            : await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({
                  email: document.getElementById('email').value.trim().toLowerCase(),
                  password: document.getElementById('password').value,
                }),
              });

          const contentType = response.headers.get('content-type') || '';
          if (!contentType.includes('application/json')) {
            throw new Error('Server returned HTML instead of JSON. Ensure backend is running.');
          }

          const data = await response.json();

          if (data.success && data.emailCodeRequired) {
            emailCodePending = true;
            document.querySelectorAll('.credential-field').forEach((field) => {
              field.style.display = 'none';
            });
            document.querySelector('.forgot-password-link').style.display = 'none';
            verificationPanel.classList.add('is-visible');
            emailCode.required = true;
            loginButton.textContent = 'Verify and Login';
            successMsg.style.display = 'none';
            emailCode.focus();
          } else if (data.success) {
            window.location.replace('/admin-dashboard.html');
          } else {
            successMsg.style.display = 'none';
            errorMsg.style.display = 'block';
            errorMsg.textContent = data.message || 'Login failed';
          }
        } catch (error) {
          successMsg.style.display = 'none';
          errorMsg.style.display = 'block';
          errorMsg.textContent = 'Connection error: ' + error.message;
        } finally {
          loginButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
