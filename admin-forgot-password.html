<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Admin Password | King's Shalom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1rem; background: #0A2E5D; font-family: 'Poppins', sans-serif; color: #1f2937; }
      .auth-panel { width: min(100%, 420px); padding: 2.5rem; background: #fff; border-radius: 8px; box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25); }
      h1 { margin: 0 0 0.5rem; color: #0A2E5D; font-size: 1.65rem; }
      p { margin: 0 0 1.5rem; color: #64748b; font-size: 0.92rem; line-height: 1.6; }
      label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
      input { width: 100%; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
      input:focus { outline: 3px solid rgba(10, 46, 93, 0.14); border-color: #0A2E5D; }
      button { width: 100%; margin-top: 1rem; padding: 0.8rem; border: 0; border-radius: 6px; background: #0A2E5D; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.65; cursor: wait; }
      .status { display: none; margin-top: 1rem; font-size: 0.9rem; }
      .status.success { color: #166534; }
      .status.error { color: #b91c1c; }
      a { display: block; margin-top: 1.25rem; text-align: center; color: #0A2E5D; font-size: 0.9rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main class="auth-panel">
      <h1>Reset your password</h1>
      <p>Enter your administrator email. We will send a secure verification link if it is authorized.</p>
      <form id="forgotForm">
        <label for="email">Admin email</label>
        <input id="email" type="email" autocomplete="email" required />
        <button id="submitButton" type="submit">Send reset link</button>
        <div class="status" id="status" role="status"></div>
      </form>
      <a href="admin-login.html">Back to admin login</a>
    </main>
    <script>
      const form = document.getElementById('forgotForm');
      const submitButton = document.getElementById('submitButton');
      const status = document.getElementById('status');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        status.style.display = 'none';

        try {
          const response = await fetch('/api/admin/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: document.getElementById('email').value.trim().toLowerCase() }),
          });
          const data = await response.json();
          status.className = `status ${response.ok ? 'success' : 'error'}`;
          status.textContent = data.message || 'Unable to request a reset link.';
          status.style.display = 'block';
        } catch {
          status.className = 'status error';
          status.textContent = 'Unable to reach the server. Please try again.';
          status.style.display = 'block';
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
