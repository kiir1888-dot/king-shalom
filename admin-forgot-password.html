<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Admin Password | King's Shalom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --navy: #082a4a; --blue: #0d4775; --gold: #e9b949; --teal: #168c87; --ink: #172536; --muted: #65758b; }
      * { box-sizing: border-box; }
      body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1.25rem; background-color: var(--navy); background-image: linear-gradient(135deg, rgba(22, 140, 135, 0.28), transparent 42%), repeating-linear-gradient(120deg, transparent 0 48px, rgba(255, 255, 255, 0.035) 48px 49px); font-family: 'Poppins', sans-serif; color: var(--ink); }
      .auth-panel { position: relative; overflow: hidden; width: min(100%, 440px); padding: 2.75rem; background: #fff; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 8px; box-shadow: 0 24px 70px rgba(0, 12, 30, 0.36); }
      .auth-panel::before { content: ''; position: absolute; inset: 0 0 auto; height: 5px; background: linear-gradient(90deg, var(--gold) 0 52%, var(--teal) 52% 100%); }
      .brand-mark { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 1.25rem; border-radius: 8px; background: var(--navy); color: var(--gold); font-weight: 700; }
      h1 { margin: 0 0 0.5rem; color: var(--navy); font-size: 1.65rem; }
      p { margin: 0 0 1.5rem; color: var(--muted); font-size: 0.92rem; line-height: 1.6; }
      .recovery-note { padding: 0.85rem 1rem; border-left: 3px solid var(--gold); background: #fff9e8; color: #5f4a16; font-size: 0.82rem; }
      label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
      input { width: 100%; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
      input:focus { outline: 3px solid rgba(22, 140, 135, 0.14); border-color: var(--teal); }
      button { width: 100%; margin-top: 1rem; padding: 0.8rem; border: 0; border-radius: 6px; background: var(--navy); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: var(--blue); }
      button:disabled { opacity: 0.65; cursor: wait; }
      .status { display: none; margin-top: 1rem; font-size: 0.9rem; }
      .status.success { color: #166534; }
      .status.error { color: #b91c1c; }
      a { display: block; margin-top: 1.25rem; text-align: center; color: var(--navy); font-size: 0.9rem; font-weight: 600; }
      a:hover { color: var(--teal); }
      @media (max-width: 480px) { .auth-panel { padding: 2.25rem 1.5rem; } }
    </style>
  </head>
  <body>
    <main class="auth-panel">
      <div class="brand-mark" aria-hidden="true">KS</div>
      <h1>Reset your password</h1>
      <p>Enter your administrator email. We will send a secure verification link if it is authorized.</p>
      <p class="recovery-note">Use the newest email you receive. Older reset links may point to an expired or previous address.</p>
      <form id="forgotForm">
        <label for="email">Admin email</label>
        <input id="email" type="email" autocomplete="email" required />
        <button id="submitButton" type="submit">Send reset link</button>
        <div class="status" id="status" role="status"></div>
      </form>
      <a href="admin-login.html">Back to admin login</a>
    </main>
    <script>
      const form = document.getElementById('forgotForm');
      const submitButton = document.getElementById('submitButton');
      const status = document.getElementById('status');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        status.style.display = 'none';

        try {
          const response = await fetch('/api/admin/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: document.getElementById('email').value.trim().toLowerCase() }),
          });
          const data = await response.json();
          status.className = `status ${response.ok ? 'success' : 'error'}`;
          status.textContent = data.message || 'Unable to request a reset link.';
          status.style.display = 'block';
        } catch {
          status.className = 'status error';
          status.textContent = 'Unable to reach the server. Please try again.';
          status.style.display = 'block';
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
